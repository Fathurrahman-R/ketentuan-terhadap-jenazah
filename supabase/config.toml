# Konfigurasi Supabase CLI
project_id = "kuis"

# Edge Function submit-quiz
# verify_jwt dinonaktifkan (false) agar endpoint dapat dipanggil oleh publik / tamu,
# baik frontend menggunakan token anon lama (JWT) maupun API key baru (sb_publishable_).
# Keamanan dijamin lewat validasi ketat, rate limiting (ip_hash), anti-duplikat, dan honeypot.
[functions.submit-quiz]
verify_jwt = false

# Edge Function export-hasil
# verify_jwt dinonaktifkan (false) karena pemanggil adalah Google Apps Script (server-to-server).
# Autentikasi dilakukan di dalam fungsi menggunakan secret EXPORT_TOKEN (header x-export-token).
[functions.export-hasil]
verify_jwt = false
